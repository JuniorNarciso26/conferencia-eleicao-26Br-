name = "conferencia-eleitoral-api"
main = "src/worker.js"
compatibility_date = "2026-10-01"
# Preserva secrets/vars configurados manualmente no painel Cloudflare.
keep_vars = true

# Preencher o UUID mostrado em Cloudflare D1 > conferencia-eleitoral.
# O ID provisório abaixo impede deploy acidental contra outra base.
[[d1_databases]]
binding = "DB"
database_name = "conferencia-eleitoral"
database_id = "PREENCHER_ID_D1"

[vars]
SITE_URL = "https://juniornarciso26.github.io/conferencia-eleicao-26Br-/"
API_ORIGIN = "https://conferencia-eleitoral-api.junior-ab2.workers.dev"
