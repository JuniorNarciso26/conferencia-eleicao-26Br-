name: Sincronizar municipios e zonas TSE 2026
on:
  push:
    branches: [feature/catalogo-oficial-localidades-2026]
    paths:
      - 'scripts/gerar_catalogo_localidades.py'
      - '.github/workflows/catalogo-localidades.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalogo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar catálogo TSE
        run: python3 scripts/gerar_catalogo_localidades.py
      - name: Validar snapshot
        run: python3 -m json.tool site/dados/localidades_2026.json > /dev/null
      - name: Commitar JSON na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dados/localidades_2026.json
          git diff --cached --quiet && exit 0
          git commit -m "data: snapshot oficial TSE municipios zonas 2026"
          git push origin "HEAD:""$GITHUB_REF_NAME"
