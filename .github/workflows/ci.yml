name: MVP - testes offline
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sintaxe dos scripts
        run: python -m compileall -q scripts tests
      - name: Testes unitarios sem rede
        run: python -m unittest discover -s tests -v
