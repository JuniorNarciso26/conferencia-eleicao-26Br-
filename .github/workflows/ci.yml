name: MVP - testes offline
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sintaxe Python e shell
        run: |
          python -m compileall -q scripts tests
          bash -n scripts/*.sh scripts/coleta
      - name: Testes unitarios sem rede
        run: python -m unittest discover -s tests -v

  dependencias_python312:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar hashes das dependencias homologadas no Linux
        run: |
          PYTHON=python bash scripts/instalar_vps.sh
          .venv/bin/python -c "import sys, dataurnas, bitstruct; assert sys.version_info[:2] == (3, 12)"
          test -f vendor/DataUrnas-BR/pyproject.toml
          test -f vendor/DataUrnas-BR/spec/v2/bu.asn1
